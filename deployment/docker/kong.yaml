_format_version: "3.0"

services:
  - name: message-service
    url: http://host.docker.internal:${MESSAGEUCOLAB_PORT}
    routes:
      - name: messageucolab-api
        paths:
          - /messageucolab/v1
        strip_path: false

      # Consumo de mensajes por las aplicaciones consumidoras (identidad de servicio):
      # limite de peticiones por cliente, porque una traduccion nueva llama al modelo de IA.
      - name: messageucolab-consumer
        paths:
          - /messageucolab/v1/messages/consumer
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              policy: local
              limit_by: ip

      - name: messageucolab-health
        paths:
          - /actuator/health
        methods:
          - GET
        strip_path: false

      - name: messageucolab-swagger
        paths:
          - /swagger-ui
          - /swagger-ui.html
          - /openapi.yaml
          - /v3/api-docs
        methods:
          - GET
        strip_path: false
