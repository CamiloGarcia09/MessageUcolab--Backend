# Opt-in local override; requires Docker Compose 2.24.4+ for !override.
# Use with docker-compose.yml. Do not run the seed initializers again.
services:
  messageucolab:
    ports: !override
      - "127.0.0.1:${MESSAGEUCOLAB_PORT}:${MESSAGEUCOLAB_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: local-workspace
      LOCAL_WORKSPACE_BIND_ADDRESS: 0.0.0.0
      LOCAL_WORKSPACE_ORGANIZATION_ID: ${LOCAL_WORKSPACE_ORGANIZATION_ID:-8f2d3a10-6b47-4c91-a5e8-2d7f9b3c1a40}
      LOCAL_WORKSPACE_ORGANIZATION_NAME: ${LOCAL_WORKSPACE_ORGANIZATION_NAME:-UCO}
      LOCAL_WORKSPACE_APPLICATION_ID: ${LOCAL_WORKSPACE_APPLICATION_ID:-c4a91e72-8d36-4f5b-b2a7-6e1c9d804f23}
      LOCAL_WORKSPACE_APPLICATION_NAME: ${LOCAL_WORKSPACE_APPLICATION_NAME:-Arquisoft}
      LOCAL_WORKSPACE_ENVIRONMENT_ID: ${LOCAL_WORKSPACE_ENVIRONMENT_ID:-7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82}
      LOCAL_WORKSPACE_ENVIRONMENT_NAME: ${LOCAL_WORKSPACE_ENVIRONMENT_NAME:-Develop}
