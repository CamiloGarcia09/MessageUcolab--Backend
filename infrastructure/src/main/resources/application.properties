spring.application.name=Infrastructure
server.port=8085
spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# La sesion BFF es el flujo normal de acceso, sin perfiles de seguridad.
components.security.session.pdp-url=${SECURITY_PDP_URL:http://localhost:18080}

# OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operations-sorter=method

# Azure Configuration
azure.keyvault.url=${AZURE_KEYVAULT_UCOLAB_ENDPOINT}
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_UCOLAB_ENDPOINT}
spring.cloud.azure.keyvault.secret.property-sources[0].enabled=${AZURE_KEYVAULT_ENABLED:true}
spring.cloud.azure.keyvault.secret.enabled=${AZURE_KEYVAULT_ENABLED:true}


# API Configuration
components.security.session.identity-source=security-baseline
crosswords.api.path.messages=/messageucolab/v1/messages
crosswords.api.path.public-messages=/messageucolab/v1/public/messages
crosswords.api.path.application=/messageucolab/v1/application
crosswords.api.path.functionality=/messageucolab/v1/application/functionality

# Bound multipart imports before workbook parsing; Excel has an additional expanded-size limit.
spring.webflux.multipart.max-disk-usage-per-part=5MB
spring.webflux.multipart.max-parts=2

# Redis cache
spring.data.redis.host=${REDISHOST}
spring.data.redis.port=${REDISPORT}
spring.data.redis.password=${REDISPASSWORD}
spring.data.redis.database=${REDISDATABASE}

# Prometheus
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

# Pulsar Configuration
pulsar.service-url=${PULSARURL}
pulsar.topic-name=${PULSARTOPICNAME}

# SurrealDB Configuration
surreal.host=${SURREALDBHOST}
surreal.port=${SURREALDBPORT}
surreal.username=${SURREALDBUSER}
surreal.password=${SURREALDBPASSWORD}
surreal.namespace=${SURREALDBNAMESPACE}
surreal.database=${SURREALDBDATABASE}
surreal.max-connections=10
surreal.projection.initial-delay-ms=2000
surreal.projection.poll-delay-ms=2000
surreal.projection.batch-size=100

# Dynamic translation with LangChain4j. Default provider is Ollama, a free local model runner
translation.ai.enabled=${TRANSLATION_AI_ENABLED:true}
translation.ai.provider=${TRANSLATION_AI_PROVIDER:ollama}
translation.ai.api-key=${TRANSLATION_AI_API_KEY:}
translation.ai.base-url=${TRANSLATION_AI_BASE_URL:http://ollama:11434}
translation.ai.model-name=${TRANSLATION_AI_MODEL_NAME:llama3.2}
translation.ai.temperature=${TRANSLATION_AI_TEMPERATURE:0.1}
translation.ai.max-retries=${TRANSLATION_AI_MAX_RETRIES:0}
translation.ai.timeout-seconds=${TRANSLATION_AI_TIMEOUT_SECONDS:30}



# Preserve the existing HTTP JSON defaults while Boot uses Jackson 3.
spring.jackson.use-jackson2-defaults=true

security.enabled=true
security.pep.enforcement.enabled=true
security.pep.enforcement.pep-url=${SECURITY_PEP_ENFORCEMENT_PEP_URL:http://localhost:18081}
security.pep.enforcement.application-name=MessageUcoLab
# Security Baseline 0.1.7 solo acepta dev, lab o prod y debe estar habilitado en la aplicacion.
security.pep.enforcement.environment=${SECURITY_PEP_ENFORCEMENT_ENVIRONMENT:dev}
security.pep.enforcement.application-credential=${PEP_REGISTRATION_TOKEN}
security.pep.enforcement.allow-insecure-http=true
# La consulta publica de mensajes no pasa por el PEP hasta que seguridad autorice aplicacion a aplicacion.
security.pep.enforcement.public-paths=/actuator/health,/messageucolab/v1/public/**
# public: cualquier aplicacion existente puede consultar los mensajes de sus ambientes.
messageucolab.consumer.authorization.mode=${MESSAGEUCOLAB_CONSUMER_AUTHORIZATION_MODE:public}
