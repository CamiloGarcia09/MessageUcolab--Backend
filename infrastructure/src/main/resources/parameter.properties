# ============================================
# PARAMETER CATALOG - NosGraduamos-FC
# Format: CODE=configuration_property_name
# ============================================

# --- Server ---
SERVER-PORT=server.port
SERVER-NAME=spring.application.name

# --- SurrealDB ---
SURREAL-HOST=surreal.host
SURREAL-PORT=surreal.port
SURREAL-USERNAME=surreal.username
SURREAL-PASSWORD=surreal.password
SURREAL-NAMESPACE=surreal.namespace
SURREAL-DATABASE=surreal.database
SURREAL-MAX-CONNECTIONS=surreal.max-connections
SURREAL-PROJECTION-ENABLED=surreal.projection.enabled
SURREAL-PROJECTION-INITIAL-DELAY=surreal.projection.initial-delay-ms
SURREAL-PROJECTION-POLL-DELAY=surreal.projection.poll-delay-ms
SURREAL-PROJECTION-BATCH-SIZE=surreal.projection.batch-size

# --- Redis ---
REDIS-HOST=spring.data.redis.host
REDIS-PORT=spring.data.redis.port
REDIS-PASSWORD=spring.data.redis.password
REDIS-DATABASE=spring.data.redis.database

# --- Pulsar ---
PULSAR-SERVICE-URL=pulsar.service-url
PULSAR-TOPIC-NAME=pulsar.topic-name

# --- Azure Key Vault ---
AZURE-KEYVAULT-URL=azure.keyvault.url
AZURE-KEYVAULT-ENDPOINT=spring.cloud.azure.keyvault.secret.property-sources[0].endpoint
AZURE-KEYVAULT-ENABLED=spring.cloud.azure.keyvault.secret.property-sources[0].enabled

# --- Translation AI ---
TRANSLATION-AI-ENABLED=translation.ai.enabled
TRANSLATION-AI-PROVIDER=translation.ai.provider
TRANSLATION-AI-API-KEY=translation.ai.api-key
TRANSLATION-AI-BASE-URL=translation.ai.base-url
TRANSLATION-AI-MODEL-NAME=translation.ai.model-name
TRANSLATION-AI-TEMPERATURE=translation.ai.temperature
TRANSLATION-AI-MAX-RETRIES=translation.ai.max-retries
TRANSLATION-AI-TIMEOUT=translation.ai.timeout-seconds

# --- API Paths ---
API-PATH-MESSAGE=crosswords.api.path.messages

# --- Headers ---
HEADER-ACCEPT=Accept
HEADER-CORRELATION-ID=X-Correlation-ID
HEADER-CONTENT-TYPE=Content-Type
HEADER-AUTHORIZATION=Authorization

# --- Serializers ---
SERIAL-JSON=application/json
SERIAL-YAML=application/yaml
SERIAL-XML=application/xml
SERIAL-TEXT=text/plain
SERIAL-HTML=text/html
