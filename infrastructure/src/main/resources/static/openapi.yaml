openapi: 3.0.3
info:
  title: MessageUcoLab API
  description: |
    Contrato de la API de MessageUcoLab bajo el enfoque Contract First.
    Define las operaciones, parametros, modelos de entrada y salida, respuestas
    y autenticacion mediante el componente externo de seguridad. El frontend usa
    su sesion BFF para identificar al usuario. MessageUcoLab administra organizaciones
    personales y aplicaciones propias, independientes de las aplicaciones de seguridad.
    MessageUcoLab no emite tokens propios ni acepta el header Token.
    Los textos administrativos, errores y catálogos iniciales se presentan en español.
    Los ambientes se denominan Develop, Produccion y Testing. Las claves JSON,
    códigos y nombres de protocolos son identificadores técnicos y no se traducen.
    La traducción de mensajes conserva el idioma destino solicitado por el consumidor.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Servidor local

security:
  - sessionCookie: []

tags:
  - name: Importacion de mensajes
    description: Excel contextualizado, validacion sin escrituras de mensajes y confirmacion atomica e idempotente.
  - name: Mensajes
    description: Consulta y traduccion de mensajes.
  - name: Sesion
    description: Identidad validada del usuario y sus aplicaciones de negocio propias.
  - name: Catalogos
    description: Catalogos con identificadores UUID persistentes.
  - name: Administracion
    description: Organizaciones personales, aplicaciones y funcionalidades.

paths:
  /messageucolab/v1/messages/imports/template:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
    get:
      tags: [Importacion de mensajes]
      operationId: downloadMessageImportTemplate
      summary: Descargar plantilla Excel de la aplicacion propia
      description: Plantilla MESSAGEUCOLAB_IMPORT_V2 con hojas Mensajes, Instrucciones y Referencias. Los desplegables muestran nombres sin UUID y solo incluyen funcionalidades activas. La version y el UUID de contexto se guardan en una fila tecnica oculta. No incluye ambientes por fila ni admite plantillas anteriores.
      responses:
        '200':
          $ref: '#/components/responses/ImportWorkbook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/imports/validate:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
    post:
      tags: [Importacion de mensajes]
      operationId: validateMessageImport
      summary: Validar Excel sin guardar mensajes
      description: |
        Un archivo .xlsx de hasta 5 MiB y 500 mensajes en filas 2 a 501. Los ambientes son comunes a todas las filas.
        Rechaza macros, formulas, enlaces externos, datos adicionales y archivos con mas de 20 MiB expandidos.
        Reutiliza las reglas de creacion y agrega deteccion de codigos duplicados normalizados dentro del archivo.
        Requiere la plantilla MESSAGEUCOLAB_IMPORT_V2. Las referencias aceptan solo nombres exactos y univocos, no UUID ni Nombre [UUID].
        Las funcionalidades se resuelven solo dentro de la aplicacion autorizada; los nombres ambiguos son errores de fila.
        Responde 200 aunque haya errores de filas; 422 si el archivo, su contexto o sus ambientes son invalidos.
        Guarda temporalmente el borrador en Redis, separado por aplicacion, durante 30 minutos.
        La confirmacion usa ese borrador del servidor, nunca acepta filas corregidas desde el navegador.
      parameters:
        - name: environmentIds
          in: query
          required: true
          style: form
          explode: false
          description: UUID de ambientes de la aplicacion, separados por coma, sin repetidos.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo .xlsx descargado para esta aplicacion, de hasta 5 MiB.
      responses:
        '200':
          $ref: '#/components/responses/ImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: El multipart supera los limites de carga.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Importacion de mensajes]
      operationId: getMessageImportPreview
      summary: Consultar vista previa y errores actuales del borrador
      description: Despues de un conflicto de confirmacion permite recuperar los errores actualizados. Exige propiedad actual de la aplicacion.
      responses:
        '200':
          $ref: '#/components/responses/ImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/imports/{importId}/errors:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Importacion de mensajes]
      operationId: downloadMessageImportErrors
      summary: Descargar filas originales y reporte de errores en Excel
      description: Conserva los numeros originales de fila. La hoja Errores identifica fila, campo y correccion. Los valores se escriben como texto para evitar inyeccion de formulas. El archivo corregido puede volverse a validar.
      responses:
        '200':
          $ref: '#/components/responses/ImportWorkbook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/imports/{importId}/result:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Importacion de mensajes]
      operationId: getMessageImportResult
      summary: Recuperar resultado confirmado sin repetir una escritura
      description: El recibo persiste independientemente de la expiracion del borrador. data es null si todavia no existe un recibo de este lote en esta aplicacion. No afirma que una solicitud concurrente haya terminado.
      responses:
        '200':
          description: Recibo persistido, o data null si aun no consta una confirmacion.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/MessageImportReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/imports/{importId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ImportApplicationId'
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Importacion de mensajes]
      operationId: confirmMessageImport
      summary: Confirmar lote completo de forma atomica e idempotente
      description: |
        Solo crea; no actualiza mensajes ni crea funcionalidades. Exige borrador vigente y sin errores.
        Revalida ambientes, referencias y codigos antes de escribir. Produccion exige productionConfirmed=true.
        Una transaccion SurrealDB incluye todos los mensajes, sus relaciones de ambiente y el recibo del lote.
        El indice unico por aplicacion/codigo y la identidad del recibo evitan duplicados incluso con concurrencia.
        Al perder la respuesta, reintentar con el MISMO importId devuelve el recibo original si ya se confirmo.
        No repetir la carga como un lote nuevo para recuperar un resultado incierto. Una respuesta 500 o perdida
        de conexion no demuestra que no se haya guardado; consultar result o reintentar la misma confirmacion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productionConfirmed:
                  type: boolean
                  default: false
            example:
              productionConfirmed: false
      responses:
        '200':
          description: Lote confirmado completo o recibo original recuperado por idempotencia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageImportReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/consumer/translations:
    post:
      tags: [Mensajes]
      summary: Traducir un mensaje disponible para consumo
      operationId: translateConsumerMessage
      description: |
        Devuelve un objeto JSON directo con los textos traducidos, sin IDs, estado ni datos del proveedor.
        El idioma origen proviene de application.language_id, nunca del body ni de deteccion automatica.
        Exige propiedad de la aplicacion y pertenencia del ambiente mediante la sesion BFF existente.
        Solo traduce mensajes activos con asociacion activa al ambiente, incluso ante un hit de cache.
        Reutiliza MessageCatalogStrategy y el cache de traduccion Redis con scope de consumidor,
        aplicacion, ambiente y huella de la version, textos e idioma base. Las claves administrativas no cambian.
        Si Redis falla se continua sin cache; si falla SurrealDB no se entrega una traduccion sin validar.
        Se comprueba de nuevo disponibilidad y version antes de responder: 404 si deja de estar disponible,
        409 si cambia su contenido, version o idioma base durante la operacion.
        Las fechas corresponden al mensaje original. No persiste la traduccion como mensaje.
        Requiere registrar esta ruta y su permiso en el PEP externo; no implementa credenciales M2M.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: MSG_WELCOME
        - name: X-Application-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Environment-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerTranslationRequest'
            example:
              targetLanguage: es
      responses:
        '200':
          description: Mensaje traducido y disponible al comprobarlo antes de responder.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerTranslatedMessage'
              example:
                code: MSG_WELCOME
                sourceLanguage: en
                targetLanguage: es
                title: Bienvenida a MessageUcoLab
                content: Te damos la bienvenida a MessageUcoLab.
                type: Funcional
                category: Información
                functionality: Inicio de sesión
                created_at: '2026-10-20T14:30:00Z'
                updated_at: '2026-10-26T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/consumer:
    get:
      tags: [Mensajes]
      summary: Consultar un mensaje disponible para consumo
      operationId: consumeMessage
      description: |
        Reemplaza /messageucolab/v1/messages/resolve. Devuelve un objeto JSON directo,
        sin envelope administrativo, identificadores, estado ni listado de ambientes.
        La sesion BFF debe ser propietaria de la aplicacion y el ambiente debe pertenecerle.
        Solo entrega mensajes activos con una asociacion activa al ambiente solicitado.
        Reutiliza MessageCatalogStrategy: Redis primero y SurrealDB ante ausencia o fallo de cache.
        Un acierto requiere verificar disponibilidad y version en SurrealDB; si cambia,
        se recarga el mensaje. No se sirve cache cuando falla esa verificacion.
        La nueva ruta necesita su permiso en el PEP externo. No admite acceso maquina-a-maquina.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: MSG_WELCOME
        - name: X-Application-Id
          in: header
          required: true
          description: UUID de una aplicacion de una organizacion propia de la sesion BFF.
          schema:
            type: string
            format: uuid
        - name: X-Environment-Id
          in: header
          required: true
          description: UUID de un ambiente de la aplicacion indicada.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mensaje activo y habilitado para la aplicacion y el ambiente solicitados.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerMessage'
              example:
                code: MSG_WELCOME
                title: Bienvenido
                content: Bienvenido a MessageUcoLab
                type: Funcional
                category: Información
                functionality: Inicio de sesion
                created_at: '2026-10-20T14:30:00Z'
                updated_at: '2026-10-26T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/session/user:
    get:
      tags: [Sesion]
      summary: Consultar usuario autenticado
      description: Referencia local obtenida del BFF. El correo es informativo, no una clave de autorizacion.
      operationId: findWorkspaceUser
      responses:
        '200':
          description: Usuario autenticado, dentro del arreglo data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: BFF o persistencia del espacio de trabajo no disponibles. No se permite acceso por defecto.

  /messageucolab/v1/organizations:
    get:
      tags: [Administracion]
      summary: Listar mis organizaciones
      operationId: findPersonalOrganizations
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Identidad o espacio de trabajo no disponibles.
    post:
      tags: [Administracion]
      summary: Crear organizacion personal
      description: El servidor asigna el propietario desde la sesion. No acepta un propietario en el cuerpo.
      operationId: createPersonalOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '200':
          description: Organizacion creada. data contiene un elemento con id y name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Identidad o espacio de trabajo no disponibles.

  /messageucolab/v1/organizations/{organizationId}/applications:
    get:
      tags: [Administracion]
      summary: Listar aplicaciones de una organizacion propia
      operationId: findPersonalOrganizationApplications
      description: Devuelve id, name y language (id y name del idioma base persistido). language se omite si la referencia no tiene un nombre disponible; nunca se sustituye por el idioma del navegador ni por el primero del catalogo.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aplicaciones propias con su idioma base persistido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationCatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Falta permiso PEP, o la organizacion no existe o no pertenece al usuario (FUN_215).
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Identidad o espacio de trabajo no disponibles.

  /messageucolab/v1/application:
    post:
      tags: [Administracion]
      summary: Crear aplicacion
      description: |
        Crea una aplicacion asociada a una organizacion y aprovisiona atomicamente
        sus ambientes Develop, Testing y Produccion en estado Activo.
        El servidor genera un UUID propio; un id enviado por compatibilidad se ignora.
        organizationId debe referenciar una organizacion propiedad del usuario autenticado.
        El PEP exige el permiso de la ruta y el dominio comprueba la propiedad de los datos.
      operationId: createApplication
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Aplicacion creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Aplicación creada exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/functionality:
    post:
      tags: [Administracion]
      summary: Crear funcionalidad
      description: |
        Crea una funcionalidad para una aplicacion. No recibe fechas de inicio o fin.
        applicationId debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        El PEP exige el permiso de la ruta; no hay permisos ni roles locales.
      operationId: createFunctionality
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionalityRequest'
      responses:
        '200':
          description: Funcionalidad creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Funcionalidad creada exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages:
    post:
      tags: [Mensajes]
      summary: Crear mensaje
      description: |
        Crea un mensaje en los environmentIds indicados. Deben pertenecer a la aplicacion
        de X-Application-Id, validada contra la sesion BFF. La funcionalidad debe pertenecer
        a esa aplicacion y estar activa; una funcionalidad inactiva o de estado no resoluble
        produce 422 con el mensaje de catalogo FUN_217, aunque se envie su UUID directamente.
      operationId: createMessage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Mensaje creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Mensaje creado exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Mensajes]
      summary: Consultar mensajes
      description: |
        Con code retorna data como una lista con el mensaje encontrado; los parametros
        de paginacion no se usan. Sin code retorna data como una lista con un objeto
        de pagina, cuyo campo data contiene los mensajes.
        Los mensajes pertenecen a la aplicacion del contexto (en modo sesion, X-Application-Id
        validado contra las organizaciones propias del usuario). Cada mensaje informa en environments los
        ambientes donde existe; filterEnvironments limita el listado a esos ambientes.
        La consulta y el listado incluyen status, statusId, functionalityId, createdAt y updatedAt.
        updatedAt es la fecha persistida de ultima escritura del mensaje, no la fecha de consulta.
        Los filtros del listado se combinan con AND antes de calcular la pagina y sus totales.
        filterTitle busca coincidencias parciales sin distinguir mayusculas. Con columnSort=updatedAt,
        sort=DESC muestra primero los mensajes modificados mas recientemente y ASC los mas antiguos.
        El orden se aplica antes de paginar; los empates de fecha se resuelven por codigo ascendente.
        Con code se consulta un mensaje concreto y no se aplican los filtros del listado.
      operationId: findMessages
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: query
          description: Codigo funcional del mensaje. Cuando se informa, la consulta retorna ese mensaje.
          schema:
            type: string
        - name: page
          in: query
          description: Numero de pagina, empezando en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Cantidad de elementos por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          description: Direccion de ordenamiento.
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: columnSort
          in: query
          description: Usar updatedAt para ordenar por ultima modificacion o code para ordenar por codigo.
          schema:
            type: string
            default: id
        - name: filterEnvironments
          in: query
          description: Ids de ambiente separados por coma. Vacio muestra los mensajes de todos los ambientes de la aplicacion.
          schema:
            type: string
          example: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82,de1b8223-1e9c-4807-beec-b2c1cff44e73
        - name: filterCode
          in: query
          description: Coincidencia parcial por codigo, sin distinguir mayusculas, en el listado sin code.
          schema:
            type: string
          example: MSG_WELCOME
        - name: filterTitle
          in: query
          description: Coincidencia parcial por titulo, sin distinguir mayusculas. Se combina con los demas filtros mediante AND.
          schema:
            type: string
          example: Bienvenida
        - name: filterStatusId
          in: query
          description: UUID del estado del mensaje. Coincidencia exacta; no confunde Activo con Inactivo.
          schema:
            type: string
            format: uuid
        - name: filterFunctionalityId
          in: query
          description: UUID de la funcionalidad. Coincidencia exacta dentro de la aplicacion autorizada.
          schema:
            type: string
            format: uuid
        - name: filterStatus
          in: query
          description: Filtro legado de texto parcial por nombre de estado. Para selectores usar filterStatusId.
          schema:
            type: string
        - name: filterFunctionality
          in: query
          description: Filtro legado de texto parcial por nombre de funcionalidad. Para selectores usar filterFunctionalityId.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MessagesFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/{messageCode}:
    put:
      tags: [Mensajes]
      summary: Editar mensaje o reemplazar solamente sus ambientes
      description: |
        Reutiliza la ruta de edicion existente y su permiso PEP. X-Application-Id
        se valida contra la propiedad de la organizacion de la sesion BFF.
        Con environmentsOnly=true solo reemplaza las relaciones de ambientes y actualiza
        updatedAt; no escribe titulo, contenido, tipo, categoria, estado ni funcionalidad,
        aunque esos campos se envien. Requiere al menos un ambiente de la aplicacion.
        Sin esa bandera conserva la edicion completa anterior; omitir environmentIds
        conserva los ambientes existentes. La edicion masiva del minifront aplica una
        solicitud por codigo y puede tener resultados parciales; no es una transaccion de lote.
      operationId: updateMessage
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MessageCode'
        - name: X-Application-Id
          in: header
          required: true
          description: Aplicacion propia a la que pertenece el mensaje.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
            examples:
              environmentsOnly:
                summary: Reemplazar ambientes sin modificar el resto del mensaje
                value:
                  environmentsOnly: true
                  environmentIds:
                    - 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
      responses:
        '200':
          description: Mensaje actualizado; respuesta con data y errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/{messageCode}/translations:
    post:
      tags: [Mensajes]
      summary: Traducir mensaje
      description: Traduce un mensaje de la aplicacion autorizada mediante X-Application-Id y la sesion BFF, sin guardar la traduccion.
      operationId: translateMessageByCode
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MessageCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageTranslated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/session/applications:
    get:
      tags: [Sesion]
      summary: Listar aplicaciones de la sesion
      description: Retorna las aplicaciones de las organizaciones personales del usuario. registered siempre es true. Requiere el permiso de negocio correspondiente en el PEP; no consulta las aplicaciones asignadas en seguridad.
      operationId: findSessionApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Aplicaciones de la sesion obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionApplicationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications:
    get:
      tags: [Catalogos]
      summary: Listar aplicaciones
      description: |
        Lista solo las aplicaciones de las organizaciones propias del usuario
        de la sesion BFF. Sin organizaciones propias se devuelve una lista vacia.
      operationId: findApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications/{applicationId}/environments:
    get:
      tags: [Catalogos]
      summary: Listar ambientes de una aplicacion
      description: |
        La aplicacion debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        Retorna sus ambientes, sin consultar contextos ni permisos locales.
      operationId: findEnvironmentsByApplication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications/{applicationId}/functionalities:
    get:
      tags: [Catalogos]
      summary: Listar funcionalidades de una aplicacion
      description: |
        La aplicacion debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        Retorna sus funcionalidades, sin consultar contextos ni permisos locales.
        Conserva id y name y agrega stateId, state y active. Incluye activas e inactivas
        para administracion y consulta historica. Crear mensaje solo debe ofrecer elementos
        con active=true; el backend tambien rechaza una funcionalidad inactiva al crear.
        Si el estado no puede resolverse, state queda vacio y active=false, nunca activo por defecto.
      operationId: findFunctionalitiesByApplication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Funcionalidades de la aplicacion propia, incluyendo su estado real.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-types:
    get:
      tags: [Catalogos]
      summary: Listar tipos de mensaje
      operationId: findMessageTypes
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-categories:
    get:
      tags: [Catalogos]
      summary: Listar categorias de mensaje
      operationId: findMessageCategories
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje
      operationId: findMessageStates
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-environment-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje por ambiente
      operationId: findMessageEnvironmentStates
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SECURITY_BASELINE_SESSION
      description: Sesion BFF externa. El PEP conserva la autorizacion por ruta.

  parameters:
    ImportApplicationId:
      name: X-Application-Id
      in: header
      required: true
      description: UUID de una aplicacion cuya organizacion pertenece a la identidad de la sesion BFF. No se confia en la aplicacion del Excel como autorizacion.
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      description: Identificador opaco del borrador generado por el servidor; conservarlo para reintentos de confirmacion.
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Identificador unico de la aplicacion.
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    MessageCode:
      name: messageCode
      in: path
      required: true
      description: Codigo del mensaje.
      schema:
        type: string
        example: MSG_001

  responses:
    ImportWorkbook:
      description: Libro Excel descargable. Cache-Control no-store.
      headers:
        Content-Disposition:
          schema:
            type: string
          example: attachment; filename="plantilla-mensajes.xlsx"
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    ImportPreview:
      description: Vista previa con un error accionable por campo invalido. Las filas invalidas no impiden revisar las demas. Cache-Control no-store.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/MessageImportPreview'
    MessagesFound:
      description: Mensaje por codigo o pagina de mensajes, segun la presencia del parametro code.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
          examples:
            byCode:
              summary: Consulta con code=MSG_WELCOME
              value:
                data:
                  - code: MSG_WELCOME
                    title: Mensaje de bienvenida
                    content: Bienvenido a nuestra aplicacion
                    type: Funcional
                    category: Información
                    functionality: Inicio
                    functionalityId: 123e4567-e89b-12d3-a456-426614174070
                    status: Activo
                    statusId: 123e4567-e89b-12d3-a456-426614174060
                    createdAt: '2026-10-22T12:00:00Z'
                    updatedAt: '2026-10-22T14:30:00Z'
                    environments:
                      - id: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
                        name: Develop
                errors: []
            paginated:
              summary: Consulta sin code
              value:
                data:
                  - data:
                      - code: MSG_WELCOME
                        title: Mensaje de bienvenida
                        content: Bienvenido a nuestra aplicacion
                        type: Funcional
                        category: Información
                        functionality: Inicio
                        functionalityId: 123e4567-e89b-12d3-a456-426614174070
                        status: Activo
                        statusId: 123e4567-e89b-12d3-a456-426614174060
                        createdAt: '2026-10-22T12:00:00Z'
                        updatedAt: '2026-10-22T14:30:00Z'
                        environments:
                          - id: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
                            name: Develop
                    page: 1
                    size: 50
                    totalItems: 1
                    totalPages: 1
                errors: []
        application/yaml:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
        application/xml:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    MessageTranslated:
      description: Mensaje traducido correctamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        application/yaml:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    CatalogFound:
      description: Catalogo obtenido correctamente. Cada id es un UUID persistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
          example:
            data:
              - id: 123e4567-e89b-12d3-a456-426614174000
                name: Elemento de ejemplo
            errors: []
        application/yaml:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    BadRequest:
      description: Solicitud o parametros invalidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Sesion BFF ausente o invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos para el recurso o fuera del contexto autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: Formato de respuesta no soportado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto por duplicidad o por jerarquia de recursos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Los datos no cumplen las reglas de validacion del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MessageImportPreview:
      type: object
      required: [importId, applicationId, environmentIds, rows, expiresAt]
      properties:
        importId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        environmentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [row, normalizedCode, message, issues]
            properties:
              row:
                $ref: '#/components/schemas/MessageImportRow'
              normalizedCode:
                type: string
                example: MSG_WELCOME
              message:
                type: object
                description: DTO canonico evaluado por el servidor; puede ser invalido. Informativo, nunca reenviarlo para confirmar.
              issues:
                type: array
                description: Vacio para una fila valida. La confirmacion requiere todas las filas validas.
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field:
                      type: string
                      enum: [code, functionality, type, category, status, title, content, environments]
                    message:
                      type: string
                      example: El codigo esta repetido dentro del archivo despues de normalizarlo. Usa un codigo distinto para cada mensaje.
    MessageImportRow:
      type: object
      required: [rowNumber, code, functionality, type, category, status, title, content]
      properties:
        rowNumber:
          type: integer
          minimum: 2
          maximum: 501
        code:
          type: string
          description: Sufijo original sin MSG_, con las mismas reglas de creacion individual.
        functionality:
          type: string
          description: Nombre exacto y univoco de una funcionalidad de la aplicacion autorizada. Solo nombres, sin UUID. Se comprueba que este activa.
        type:
          type: string
          description: Nombre exacto y univoco del catalogo de tipos, sin UUID.
        category:
          type: string
          description: Nombre exacto y univoco del catalogo de categorias, sin UUID.
        status:
          type: string
          description: Nombre exacto y univoco del catalogo de estados, sin UUID.
        title:
          type: string
        content:
          type: string
    ApplicationCatalogItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        language:
          type: object
          nullable: true
          description: Idioma base persistido en la aplicacion. La propiedad se omite al serializar si falta la referencia o su nombre (valor interno null).
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    MessageImportReceipt:
      type: object
      required: [importId, count, environmentIds, completedAt]
      properties:
        importId:
          type: string
          format: uuid
        count:
          type: integer
          minimum: 1
          maximum: 500
          description: Mensajes unicos creados, no cantidad de relaciones de ambientes.
        environmentIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        completedAt:
          type: string
          format: date-time
    ConsumerTranslationRequest:
      type: object
      required: [targetLanguage]
      properties:
        targetLanguage:
          type: string
          description: Codigo de idioma de dos o tres letras, con subtags opcionales como pt-BR o zh-Hans.
          maxLength: 50
          pattern: '^[a-zA-Z]{2,3}([_-][a-zA-Z0-9]{2,8})*$'
          example: en
    ConsumerTranslatedMessage:
      type: object
      additionalProperties: false
      required: [code, sourceLanguage, targetLanguage, title, content, type, category, functionality, created_at, updated_at]
      properties:
        code:
          $ref: '#/components/schemas/ConsumerMessage/properties/code'
        sourceLanguage:
          type: string
          description: Codigo normalizado del idioma base registrado para la aplicacion.
          example: es
        targetLanguage:
          type: string
          description: Idioma solicitado, normalizado en minusculas y con guiones.
          example: en
        title:
          $ref: '#/components/schemas/ConsumerMessage/properties/title'
        content:
          $ref: '#/components/schemas/ConsumerMessage/properties/content'
        type:
          $ref: '#/components/schemas/ConsumerMessage/properties/type'
        category:
          $ref: '#/components/schemas/ConsumerMessage/properties/category'
        functionality:
          $ref: '#/components/schemas/ConsumerMessage/properties/functionality'
        created_at:
          $ref: '#/components/schemas/ConsumerMessage/properties/created_at'
        updated_at:
          $ref: '#/components/schemas/ConsumerMessage/properties/updated_at'

    ConsumerMessage:
      type: object
      additionalProperties: false
      required: [code, title, content, type, category, functionality, created_at, updated_at]
      properties:
        code:
          type: string
          description: Codigo funcional del mensaje dentro de la aplicacion.
        title:
          type: string
        content:
          type: string
          description: Texto original sin traduccion ni sustitucion de marcadores.
        type:
          type: string
          description: Nombre descriptivo del tipo; no es un identificador estable.
        category:
          type: string
          description: Nombre descriptivo de la categoria; no es un identificador estable.
        functionality:
          type: string
          description: Nombre descriptivo de la funcionalidad; puede estar vacio si no existe referencia.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CreationResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          description: Confirmacion de creacion; no devuelve el identificador del recurso.
          items:
            type: string
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Codigo de dominio o codigo HTTP simbolico; no es un enum cerrado.
          example: UNAUTHORIZED
        message:
          type: string
          example: Credencial ausente o invalida.
    ErrorResponse:
      type: object
      required: [data, errors, timestamp, path]
      description: |
        Estructura de los errores gestionados por el presenter y los interceptores.
        Los errores generados directamente por Spring o un proxy pueden tener otra estructura.
        Los ejemplos de esta documentacion usan Accept application/json.
      properties:
        data:
          type: array
          maxItems: 0
          items: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      example:
        data: []
        errors:
