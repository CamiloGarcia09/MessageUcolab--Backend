openapi: 3.0.3
info:
  title: MessageUcoLab API
  description: |
    Contrato de la API de MessageUcoLab bajo el enfoque Contract First.
    Define las operaciones, parametros, modelos de entrada y salida, respuestas
    y autenticacion mediante el componente externo de seguridad. El frontend usa
    su sesion BFF para identificar al usuario. MessageUcoLab administra organizaciones
    personales y aplicaciones propias, independientes de las aplicaciones de seguridad.
    MessageUcoLab no emite tokens propios ni acepta el header Token.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Servidor local

security:
  - sessionCookie: []

tags:
  - name: Mensajes
    description: Consulta y traduccion de mensajes.
  - name: Sesion
    description: Identidad validada del usuario y sus aplicaciones de negocio propias.
  - name: Catalogos
    description: Catalogos con identificadores UUID persistentes.
  - name: Administracion
    description: Organizaciones personales, aplicaciones y funcionalidades.

paths:
  /messageucolab/v1/session/user:
    get:
      tags: [Sesion]
      summary: Consultar usuario autenticado
      description: Referencia local obtenida del BFF. El correo es informativo, no una clave de autorizacion.
      operationId: findWorkspaceUser
      responses:
        '200':
          description: Usuario autenticado, dentro del arreglo data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: BFF o persistencia del espacio de trabajo no disponibles. No se permite acceso por defecto.

  /messageucolab/v1/organizations:
    get:
      tags: [Administracion]
      summary: Listar mis organizaciones
      operationId: findPersonalOrganizations
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Identidad o espacio de trabajo no disponibles.
    post:
      tags: [Administracion]
      summary: Crear organizacion personal
      description: El servidor asigna el propietario desde la sesion. No acepta un propietario en el cuerpo.
      operationId: createPersonalOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '200':
          description: Organizacion creada. data contiene un elemento con id y name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Identidad o espacio de trabajo no disponibles.

  /messageucolab/v1/organizations/{organizationId}/applications:
    get:
      tags: [Administracion]
      summary: Listar aplicaciones de una organizacion propia
      operationId: findPersonalOrganizationApplications
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Falta permiso PEP, o la organizacion no existe o no pertenece al usuario (FUN_215).
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          description: Identidad o espacio de trabajo no disponibles.

  /messageucolab/v1/application:
    post:
      tags: [Administracion]
      summary: Crear aplicacion
      description: |
        Crea una aplicacion asociada a una organizacion y aprovisiona atomicamente
        sus ambientes Develop, Testing y Production en estado Active.
        El servidor genera un UUID propio; un id enviado por compatibilidad se ignora.
        organizationId debe referenciar una organizacion propiedad del usuario autenticado.
        El PEP exige el permiso de la ruta y el dominio comprueba la propiedad de los datos.
      operationId: createApplication
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Aplicacion creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Aplicación creada exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/application/functionality:
    post:
      tags: [Administracion]
      summary: Crear funcionalidad
      description: |
        Crea una funcionalidad para una aplicacion. No recibe fechas de inicio o fin.
        applicationId debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        El PEP exige el permiso de la ruta; no hay permisos ni roles locales.
      operationId: createFunctionality
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionalityRequest'
      responses:
        '200':
          description: Funcionalidad creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Funcionalidad creada exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages:
    post:
      tags: [Mensajes]
      summary: Crear mensaje
      description: |
        Crea un mensaje en los environmentIds indicados. Deben pertenecer a la aplicacion
        de X-Application-Id, validada contra la sesion BFF. La funcionalidad debe pertenecer
        a esa aplicacion y estar activa; una funcionalidad inactiva o de estado no resoluble
        produce 422 con el mensaje de catalogo FUN_217, aunque se envie su UUID directamente.
      operationId: createMessage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Mensaje creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationResponse'
              example:
                data: [Mensaje creado exitosamente]
                errors: []
            application/yaml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CreationResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Mensajes]
      summary: Consultar mensajes
      description: |
        Con code retorna data como una lista con el mensaje encontrado; los parametros
        de paginacion no se usan. Sin code retorna data como una lista con un objeto
        de pagina, cuyo campo data contiene los mensajes.
        Los mensajes pertenecen a la aplicacion del contexto (en modo sesion, X-Application-Id
        validado contra las organizaciones propias del usuario). Cada mensaje informa en environments los
        ambientes donde existe; filterEnvironments limita el listado a esos ambientes.
        La consulta y el listado incluyen status, statusId, functionalityId, createdAt y updatedAt.
        updatedAt es la fecha persistida de ultima escritura del mensaje, no la fecha de consulta.
        Los filtros del listado se combinan con AND antes de calcular la pagina y sus totales.
        Con code se consulta un mensaje concreto y no se aplican los filtros del listado.
      operationId: findMessages
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: query
          description: Codigo funcional del mensaje. Cuando se informa, la consulta retorna ese mensaje.
          schema:
            type: string
        - name: page
          in: query
          description: Numero de pagina, empezando en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Cantidad de elementos por pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          description: Direccion de ordenamiento.
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: columnSort
          in: query
          description: Campo usado para ordenar.
          schema:
            type: string
            default: id
        - name: filterEnvironments
          in: query
          description: Ids de ambiente separados por coma. Vacio muestra los mensajes de todos los ambientes de la aplicacion.
          schema:
            type: string
          example: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82,de1b8223-1e9c-4807-beec-b2c1cff44e73
        - name: filterCode
          in: query
          description: Coincidencia parcial por codigo, sin distinguir mayusculas, en el listado sin code.
          schema:
            type: string
          example: MSG_WELCOME
        - name: filterStatusId
          in: query
          description: UUID del estado del mensaje. Coincidencia exacta; no confunde Active con Inactive.
          schema:
            type: string
            format: uuid
        - name: filterFunctionalityId
          in: query
          description: UUID de la funcionalidad. Coincidencia exacta dentro de la aplicacion autorizada.
          schema:
            type: string
            format: uuid
        - name: filterStatus
          in: query
          description: Filtro legado de texto parcial por nombre de estado. Para selectores usar filterStatusId.
          schema:
            type: string
        - name: filterFunctionality
          in: query
          description: Filtro legado de texto parcial por nombre de funcionalidad. Para selectores usar filterFunctionalityId.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MessagesFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/messages/{messageCode}/translations:
    post:
      tags: [Mensajes]
      summary: Traducir mensaje
      description: Traduce un mensaje de la aplicacion autorizada mediante X-Application-Id y la sesion BFF, sin guardar la traduccion.
      operationId: translateMessageByCode
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MessageCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageTranslated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/session/applications:
    get:
      tags: [Sesion]
      summary: Listar aplicaciones de la sesion
      description: Retorna las aplicaciones de las organizaciones personales del usuario. registered siempre es true. Requiere el permiso de negocio correspondiente en el PEP; no consulta las aplicaciones asignadas en seguridad.
      operationId: findSessionApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Aplicaciones de la sesion obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionApplicationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications:
    get:
      tags: [Catalogos]
      summary: Listar aplicaciones
      description: |
        Lista solo las aplicaciones de las organizaciones propias del usuario
        de la sesion BFF. Sin organizaciones propias se devuelve una lista vacia.
      operationId: findApplications
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications/{applicationId}/environments:
    get:
      tags: [Catalogos]
      summary: Listar ambientes de una aplicacion
      description: |
        La aplicacion debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        Retorna sus ambientes, sin consultar contextos ni permisos locales.
      operationId: findEnvironmentsByApplication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/applications/{applicationId}/functionalities:
    get:
      tags: [Catalogos]
      summary: Listar funcionalidades de una aplicacion
      description: |
        La aplicacion debe pertenecer a una organizacion propia del usuario de la sesion BFF.
        Retorna sus funcionalidades, sin consultar contextos ni permisos locales.
        Conserva id y name y agrega stateId, state y active. Incluye activas e inactivas
        para administracion y consulta historica. Crear mensaje solo debe ofrecer elementos
        con active=true; el backend tambien rechaza una funcionalidad inactiva al crear.
        Si el estado no puede resolverse, state queda vacio y active=false, nunca activo por defecto.
      operationId: findFunctionalitiesByApplication
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Funcionalidades de la aplicacion propia, incluyendo su estado real.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/FunctionalityCatalogResponse'
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-types:
    get:
      tags: [Catalogos]
      summary: Listar tipos de mensaje
      operationId: findMessageTypes
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-categories:
    get:
      tags: [Catalogos]
      summary: Listar categorias de mensaje
      operationId: findMessageCategories
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje
      operationId: findMessageStates
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messageucolab/v1/catalog/message-environment-states:
    get:
      tags: [Catalogos]
      summary: Listar estados de mensaje por ambiente
      operationId: findMessageEnvironmentStates
      responses:
        '200':
          $ref: '#/components/responses/CatalogFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SECURITY_BASELINE_SESSION
      description: Sesion BFF externa. El PEP conserva la autorizacion por ruta.

  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Identificador unico de la aplicacion.
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
    MessageCode:
      name: messageCode
      in: path
      required: true
      description: Codigo del mensaje.
      schema:
        type: string
        example: MSG_001

  responses:
    MessagesFound:
      description: Mensaje por codigo o pagina de mensajes, segun la presencia del parametro code.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
          examples:
            byCode:
              summary: Consulta con code=MSG_WELCOME
              value:
                data:
                  - code: MSG_WELCOME
                    title: Mensaje de bienvenida
                    content: Bienvenido a nuestra aplicacion
                    type: Informacion
                    category: General
                    functionality: Inicio
                    functionalityId: 123e4567-e89b-12d3-a456-426614174070
                    status: Active
                    statusId: 123e4567-e89b-12d3-a456-426614174060
                    createdAt: '2026-10-22T12:00:00Z'
                    updatedAt: '2026-10-22T14:30:00Z'
                    environments:
                      - id: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
                        name: Develop
                errors: []
            paginated:
              summary: Consulta sin code
              value:
                data:
                  - data:
                      - code: MSG_WELCOME
                        title: Mensaje de bienvenida
                        content: Bienvenido a nuestra aplicacion
                        type: Informacion
                        category: General
                        functionality: Inicio
                        functionalityId: 123e4567-e89b-12d3-a456-426614174070
                        status: Active
                        statusId: 123e4567-e89b-12d3-a456-426614174060
                        createdAt: '2026-10-22T12:00:00Z'
                        updatedAt: '2026-10-22T14:30:00Z'
                        environments:
                          - id: 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
                            name: Develop
                    page: 1
                    size: 50
                    totalItems: 1
                    totalPages: 1
                errors: []
        application/yaml:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
        application/xml:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/PaginatedMessagesResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    MessageTranslated:
      description: Mensaje traducido correctamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        application/yaml:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/TranslatedMessageResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    CatalogFound:
      description: Catalogo obtenido correctamente. Cada id es un UUID persistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
          example:
            data:
              - id: 123e4567-e89b-12d3-a456-426614174000
                name: Elemento de ejemplo
            errors: []
        application/yaml:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/CatalogResponse'
        text/plain:
          schema:
            type: string
        text/html:
          schema:
            type: string
    BadRequest:
      description: Solicitud o parametros invalidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Sesion BFF ausente o invalida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos para el recurso o fuera del contexto autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: Formato de respuesta no soportado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto por duplicidad o por jerarquia de recursos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Los datos no cumplen las reglas de validacion del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CreationResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          description: Confirmacion de creacion; no devuelve el identificador del recurso.
          items:
            type: string
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Codigo de dominio o codigo HTTP simbolico; no es un enum cerrado.
          example: UNAUTHORIZED
        message:
          type: string
          example: Credencial ausente o invalida.
    ErrorResponse:
      type: object
      required: [data, errors, timestamp, path]
      description: |
        Estructura de los errores gestionados por el presenter y los interceptores.
        Los errores generados directamente por Spring o un proxy pueden tener otra estructura.
        Los ejemplos de esta documentacion usan Accept application/json.
      properties:
        data:
          type: array
          maxItems: 0
          items: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
        path:
          type: string
      example:
        data: []
        errors:
          - code: UNAUTHORIZED
            message: Credencial ausente o invalida.
        timestamp: '2026-10-06T12:00:00.000Z'
        path: /messageucolab/v1/messages
    MessagePage:
      type: object
      required: [data, page, size, totalItems, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PaginatedMessagesResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/MessagePage'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    TranslatedMessage:
      type: object
      required: [code, sourceLanguage, targetLanguage, originalTitle, originalContent, originalType, originalCategory, originalFunctionality, translatedTitle, translatedContent, translatedType, translatedCategory, translatedFunctionality, translationProvider, translationModel, translationElapsedMs, dynamicTranslation]
      properties:
        code:
          type: string
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        originalTitle:
          type: string
        originalContent:
          type: string
        originalType:
          type: string
        originalCategory:
          type: string
        originalFunctionality:
          type: string
        translatedTitle:
          type: string
        translatedContent:
          type: string
        translatedType:
          type: string
        translatedCategory:
          type: string
        translatedFunctionality:
          type: string
        translationProvider:
          type: string
          description: Proveedor utilizado; depende de la configuracion del despliegue.
        translationModel:
          type: string
          description: Modelo utilizado; depende de la configuracion del despliegue.
        translationElapsedMs:
          type: integer
          format: int64
          description: Tiempo de traduccion en milisegundos.
        dynamicTranslation:
          type: boolean
      example:
        code: MSG_WELCOME
        sourceLanguage: es
        targetLanguage: en
        originalTitle: Mensaje de bienvenida
        originalContent: Bienvenido a nuestra aplicacion
        originalType: Informacion
        originalCategory: General
        originalFunctionality: Inicio
        translatedTitle: Welcome message
        translatedContent: Welcome to our application
        translatedType: Information
        translatedCategory: General
        translatedFunctionality: Home
        translationProvider: ollama
        translationModel: modelo-configurado
        translationElapsedMs: 1200
        dynamicTranslation: true
    TranslatedMessageResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/TranslatedMessage'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    CreateApplicationRequest:
      type: object
      required: [name, organizationId, languageId, stateId]
      example:
        name: Aplicacion de ejemplo
        organizationId: 123e4567-e89b-12d3-a456-426614174010
        languageId: 123e4567-e89b-12d3-a456-426614174020
        stateId: 123e4567-e89b-12d3-a456-426614174030
      properties:
        id:
          type: string
          format: uuid
          deprecated: true
          description: Ignorado por compatibilidad. El servidor genera su propio UUID.
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Aplicacion de ejemplo
        organizationId:
          type: string
          format: uuid
        languageId:
          type: string
          format: uuid
        stateId:
          type: string
          format: uuid
    CreateFunctionalityRequest:
      type: object
      required: [name, applicationId, stateId]
      example:
        name: Inicio
        applicationId: 123e4567-e89b-12d3-a456-426614174000
        stateId: 123e4567-e89b-12d3-a456-426614174030
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Inicio
        applicationId:
          type: string
          format: uuid
        stateId:
          type: string
          format: uuid
    CreateMessageRequest:
      type: object
      required: [code, title, content, typeId, categoryId, statusId, functionalityId, environmentIds]
      example:
        code: WELCOME
        title: Mensaje de bienvenida
        content: Bienvenido a nuestra aplicacion
        typeId: 123e4567-e89b-12d3-a456-426614174040
        categoryId: 123e4567-e89b-12d3-a456-426614174050
        statusId: 123e4567-e89b-12d3-a456-426614174060
        functionalityId: 123e4567-e89b-12d3-a456-426614174070
        environmentIds:
          - 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
          - de1b8223-1e9c-4807-beec-b2c1cff44e73
      properties:
        code:
          type: string
          description: Sufijo para construir MSG_{sufijo}; los espacios se normalizan a guiones bajos. No enviar el prefijo MSG_.
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9 ]+$'
          example: WELCOME
        title:
          type: string
          minLength: 10
          maxLength: 50
          example: Welcome message
        content:
          type: string
          minLength: 10
          maxLength: 100
          example: Welcome to MessageUcoLab
        typeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        statusId:
          type: string
          format: uuid
        functionalityId:
          type: string
          format: uuid
        environmentIds:
          type: array
          description: Ambientes de la aplicacion donde se crea el mismo mensaje (uno o varios, sin repetir).
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    TranslateMessageRequest:
      type: object
      required: [targetLanguage]
      properties:
        sourceLanguage:
          type: string
          default: auto
          example: auto
        targetLanguage:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z][a-zA-Z\s_-]{1,49}$'
          example: en
    Message:
      type: object
      required: [code, title, content, type, category, functionality, status, environments]
      properties:
        code:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          type: string
        category:
          type: string
        functionality:
          type: string
        functionalityId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          description: Nombre del estado del mensaje (message_state), no del estado de su relacion con un ambiente.
          example: Active
        statusId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Ultima escritura persistida en UTC. Puede ser null en documentos historicos sin ese dato; no se inventa una fecha.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    MessageResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      example:
        name: Mi organizacion
    WorkspaceUserResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [id, email, name]
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
              name:
                type: string
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    SessionApplication:
      type: object
      required: [id, name, registered]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        registered:
          type: boolean
          description: Siempre true en el flujo personal; se conserva por compatibilidad.
        organization:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CatalogItem'
    CatalogItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    FunctionalityCatalogItem:
      allOf:
        - $ref: '#/components/schemas/CatalogItem'
        - type: object
          required: [state, active]
          properties:
            stateId:
              type: string
              format: uuid
              nullable: true
            state:
              type: string
              description: Nombre persistido en functionality_state. Vacio si falta la referencia o el estado.
              example: Active
            active:
              type: boolean
              description: true solo si hay un estado valido de funcionalidad cuyo nombre es Active.
      example:
        id: 123e4567-e89b-12d3-a456-426614174070
        name: Autenticacion
        stateId: 407de974-c8aa-43e2-a5cf-22dc7c44054b
        state: Active
        active: true
    FunctionalityCatalogResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FunctionalityCatalogItem'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    CatalogResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
    SessionApplicationsResponse:
      type: object
      required: [data, errors]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionApplication'
        errors:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/ErrorDetail'
      example:
        data:
          - id: 123e4567-e89b-12d3-a456-426614174000
            name: Aplicacion de ejemplo
            registered: true
            organization:
              id: 123e4567-e89b-12d3-a456-426614174010
              name: Organizacion de ejemplo
        errors: []
