        content:
          type: string
        type:
          type: string
        category:
          type: string
        functionality:
          type: string
        functionalityId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          description: Nombre del estado del mensaje (message_state), no del estado de su relacion con un ambiente.
          example: Activo
        statusId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Ultima escritura persistida en UTC. Puede ser null en documentos historicos sin ese dato; no se inventa una fecha.
        environments:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
