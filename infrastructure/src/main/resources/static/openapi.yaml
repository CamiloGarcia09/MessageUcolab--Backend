    CreateMessageRequest:
      type: object
      required: [code, title, content, typeId, categoryId, statusId, functionalityId, environmentIds]
      example:
        code: BIENVENIDA
        title: Mensaje de bienvenida
        content: Bienvenido a nuestra aplicacion
        typeId: 123e4567-e89b-12d3-a456-426614174040
        categoryId: 123e4567-e89b-12d3-a456-426614174050
        statusId: 123e4567-e89b-12d3-a456-426614174060
        functionalityId: 123e4567-e89b-12d3-a456-426614174070
        environmentIds:
          - 7b3e5d91-a2c8-46f0-9d14-5e7a1b6c3f82
          - de1b8223-1e9c-4807-beec-b2c1cff44e73
      properties:
        code:
          type: string
          description: Sufijo para construir MSG_{sufijo}; los espacios se normalizan a guiones bajos. No enviar el prefijo MSG_.
          minLength: 1
          maxLength: 10
          pattern: '^[A-Za-z0-9 ]+$'
          example: BIENVENIDA
        title:
          type: string
          minLength: 10
          maxLength: 50
          example: Mensaje de bienvenida
        content:
          type: string
          minLength: 10
          maxLength: 100
          example: Te damos la bienvenida a MessageUcoLab.
        typeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        statusId:
          type: string
          format: uuid
        functionalityId:
          type: string
          format: uuid
        environmentIds:
          type: array
          description: Ambientes de la aplicacion donde se crea el mismo mensaje (uno o varios, sin repetir).
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    UpdateMessageRequest:
      type: object
      description: environmentsOnly=true limita la escritura a ambientes; false u omitido requiere los campos de edicion completa.
      properties:
        environmentsOnly:
          type: boolean
          default: false
          description: Ignorar los campos de contenido y clasificacion y actualizar unicamente ambientes.
        environmentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        title:
          type: string
        content:
          type: string
        typeId:
          type: string
        categoryId:
          type: string
        statusId:
          type: string
        functionalityId:
          type: string
      oneOf:
        - required: [environmentsOnly, environmentIds]
          properties:
            environmentsOnly:
              enum: [true]
        - required: [title, content, typeId, categoryId, statusId, functionalityId]
          properties:
            environmentsOnly:
              enum: [false]
            title:
              minLength: 10
              maxLength: 50
            content:
              minLength: 10
              maxLength: 100
            typeId:
              format: uuid
            categoryId:
              format: uuid
            statusId:
              format: uuid
            functionalityId:
              format: uuid
    TranslateMessageRequest:
      type: object
      required: [targetLanguage]
      properties:
        sourceLanguage:
          type: string
          default: auto
          example: auto
        targetLanguage:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z][a-zA-Z\s_-]{1,49}$'
          example: en
    Message:
      type: object
      required: [code, title, content, type, category, functionality, status, environments]
      properties:
